name: Testes

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes unitários (Vitest)
        run: pnpm test
      - name: Cobertura dos testes (Vitest)
        run: pnpm exec vitest run --coverage --coverage.reporter=text-summary | tee coverage.txt
      - name: Resumo da cobertura
        run: |
          echo '### Cobertura dos testes da interface' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Coverage summary/,/=====$/p' coverage.txt | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Checagem de tipos
        run: pnpm typecheck
