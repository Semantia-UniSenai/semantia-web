name: Testes

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes unitários (Vitest)
        run: pnpm test
      - name: Checagem de tipos
        run: pnpm typecheck
